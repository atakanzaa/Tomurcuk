<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Teslimat</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tomurcuk/tokens.css">
<link rel="stylesheet" href="ds/tomurcuk/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap">
<style>
body{margin:0}
a{color:var(--stem)}a:hover{color:var(--stem-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1080px; box-sizing: border-box; background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 8px 10px 8px; border-bottom: 1px solid var(--line);">
    <a href="Urun.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 5l-7 7 7 7"></path></svg>
      Ürün
    </a>
    <span style="padding-right: 8px; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Adım 1 / 3</span>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 0 16px;">
    <span style="height: 3px; background: var(--stem); border-radius: 2px;"></span>
    <span style="height: 3px; background: var(--line); border-radius: 2px;"></span>
    <span style="height: 3px; background: var(--line); border-radius: 2px;"></span>
  </div>

  <h1 style="margin: 28px 16px 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 36px;">Ne zaman, nereye?</h1>

  <section style="padding: 24px 16px 0; display: grid; gap: 12px;">
    <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600;">Teslim günü</h2>
    <div class="tm-slots" role="radiogroup" aria-label="Teslim günü">
      <button type="button" class="tm-slot" role="radio" aria-checked="false" style="min-width: 0; flex: 1;">Bugün<small>21 Ekim</small></button>
      <button type="button" class="tm-slot" role="radio" aria-checked="true" style="min-width: 0; flex: 1;">Yarın<small>22 Ekim</small></button>
      <button type="button" class="tm-slot" role="radio" aria-checked="false" style="min-width: 0; flex: 1;">Cuma<small>23 Ekim</small></button>
      <button type="button" class="tm-slot" role="radio" aria-checked="false" style="min-width: 0; flex: 1;" aria-label="Başka bir gün seç">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; justify-self: center;"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
        <small>Başka gün</small>
      </button>
    </div>
  </section>

  <section style="padding: 24px 16px 0; display: grid; gap: 12px;">
    <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600;">Saat aralığı</h2>
    <div class="tm-slots" role="radiogroup" aria-label="Saat aralığı">
      <button type="button" class="tm-slot" role="radio" aria-checked="false" aria-disabled="true" style="min-width: 0; flex: 1;">10:00–13:00<small>Dolu</small></button>
      <button type="button" class="tm-slot" role="radio" aria-checked="true" style="min-width: 0; flex: 1;">13:00–16:00<small>3 yer kaldı</small></button>
      <button type="button" class="tm-slot" role="radio" aria-checked="false" style="min-width: 0; flex: 1;">16:00–19:00<small>Müsait</small></button>
    </div>
  </section>

  <section style="padding: 32px 16px 0; display: grid; gap: 16px;">
    <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600;">Kime gidiyor?</h2>
    <label class="tm-field">
      <span class="tm-field__label">Alıcının adı</span>
      <input class="tm-field__control" value="Elif Yılmaz" autocomplete="name">
    </label>
    <label class="tm-field">
      <span class="tm-field__label">Alıcının telefonu</span>
      <input class="tm-field__control" value="0532 412 88 19" inputmode="tel">
      <span class="tm-field__meta">Kurye teslimattan önce bu numarayı arar.</span>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <label class="tm-field">
        <span class="tm-field__label">İlçe</span>
        <select class="tm-field__control" style="appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat;">
          <option>Kadıköy</option>
          <option>Üsküdar</option>
          <option>Ataşehir</option>
        </select>
      </label>
      <label class="tm-field">
        <span class="tm-field__label">Mahalle</span>
        <select class="tm-field__control" style="appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat;">
          <option>Caferağa</option>
          <option>Fenerbahçe</option>
          <option>Koşuyolu</option>
        </select>
      </label>
    </div>
    <label class="tm-field">
      <span class="tm-field__label">Açık adres</span>
      <textarea class="tm-field__control" style="min-height: 80px;">Moda Cad. Şair Nefi Sok. No: 12, Daire 4</textarea>
    </label>
    <label class="tm-field">
      <span class="tm-field__label">Kuryeye not <span style="font-weight: 400; color: var(--ink-muted);">(isteğe bağlı)</span></span>
      <input class="tm-field__control" placeholder="Ör. zil çalışmıyor, arayın">
    </label>
  </section>

  <p style="margin: 20px 16px 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Caferağa'ya teslimat ücreti 90 TL.</p>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 12px 16px 28px; background: var(--paper-raised); border-top: 1px solid var(--line); box-shadow: var(--shadow-lift);">
    <div style="display: grid;">
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Toplam</span>
      <span style="font-size: 20px; line-height: 24px; font-weight: 600;">1.320 TL</span>
    </div>
    <a class="tm-btn tm-btn--primary" href="KartNotu.dc.html" style="flex: 1;">Kart notuna geç</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
