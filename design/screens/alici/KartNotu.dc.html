<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kart notu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tomurcuk/tokens.css">
<link rel="stylesheet" href="ds/tomurcuk/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap">
<style>
body{margin:0}
a{color:var(--stem)}a:hover{color:var(--stem-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1080px; box-sizing: border-box; background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--line);">
    <a href="Teslimat.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 5l-7 7 7 7"></path></svg>
      Teslimat
    </a>
    <span style="padding-right: 8px; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Adım 2 / 3</span>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 0 16px;">
    <span style="height: 3px; background: var(--stem); border-radius: 2px;"></span>
    <span style="height: 3px; background: var(--stem); border-radius: 2px;"></span>
    <span style="height: 3px; background: var(--line); border-radius: 2px;"></span>
  </div>

  <h1 style="margin: 28px 16px 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 36px;">Karta ne yazalım?</h1>

  <div aria-label="Kart notu önizlemesi" style="position: relative; height: 236px; margin: 8px 16px 0;">
    <figure class="tm-gifttag" style="position: absolute; left: 30px; top: 66px; width: 300px; margin: 0; transform: rotate(-3deg); transform-origin: 24px 50%;">
      <p class="tm-gifttag__text">Yeni evin hayırlı olsun, ilk çiçekler bizden.</p>
      <figcaption class="tm-gifttag__from">Ayşe ve Can</figcaption>
    </figure>
    <svg aria-hidden="true" width="358" height="236" viewBox="0 0 358 236" style="position: absolute; left: 0; top: 0; pointer-events: none;">
      <path d="M96 0 C 84 60, 62 100, 54 148" style="fill: none; stroke: var(--kraft-deep); stroke-width: 1.75; stroke-linecap: round;"></path>
      <circle cx="54" cy="148" r="2.5" style="fill: var(--kraft-deep);"></circle>
    </svg>
  </div>

  <section style="padding: 8px 16px 0; display: grid; gap: 16px;">
    <label class="tm-field">
      <span class="tm-field__label">Mesajınız</span>
      <textarea class="tm-field__control" style="min-height: 104px;">Yeni evin hayırlı olsun, ilk çiçekler bizden.</textarea>
      <span class="tm-field__meta"><span>Çiçekçi elle yazıp buketin üstüne asar.</span><span class="tm-field__count">46 / 250</span></span>
    </label>

    <div style="display: flex; flex-wrap: wrap; gap: 8px;" aria-label="Hazır mesajlar">
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: transparent; color: var(--ink); font: 500 14px/1 var(--font-sans); cursor: pointer;">İyi ki doğdun</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: transparent; color: var(--ink); font: 500 14px/1 var(--font-sans); cursor: pointer;">Geçmiş olsun</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: transparent; color: var(--ink); font: 500 14px/1 var(--font-sans); cursor: pointer;">Nice yıllara</button>
    </div>

    <label class="tm-field" style="margin-top: 8px;">
      <span class="tm-field__label">Kartta görünecek isim</span>
      <input class="tm-field__control" value="Ayşe ve Can">
    </label>
    <label style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer;">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--stem); flex: none;">
      <span style="display: grid; gap: 2px;">
        <span style="font-size: 16px; line-height: 22px;">İsimsiz gönder</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Kartta ve alıcıya giden mesajlarda adınız yazmaz.</span>
      </span>
    </label>

    <label class="tm-field" style="margin-top: 8px;">
      <span class="tm-field__label">Sizin telefonunuz</span>
      <input class="tm-field__control" value="0533 207 41 65" inputmode="tel">
      <span class="tm-field__meta">Sipariş yola çıkınca ve teslim edilince SMS göndeririz.</span>
    </label>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 12px 16px 28px; background: var(--paper-raised); border-top: 1px solid var(--line); box-shadow: var(--shadow-lift);">
    <div style="display: grid;">
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Toplam</span>
      <span style="font-size: 20px; line-height: 24px; font-weight: 600;">1.320 TL</span>
    </div>
    <a class="tm-btn tm-btn--primary" href="Odeme.dc.html" style="flex: 1;">Ödemeye geç</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
