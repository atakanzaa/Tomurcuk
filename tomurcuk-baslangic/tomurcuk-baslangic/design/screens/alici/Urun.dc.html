<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ürün detayı</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tomurcuk/tokens.css">
<link rel="stylesheet" href="ds/tomurcuk/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap">
<style>
body{margin:0}
a{color:var(--stem)}a:hover{color:var(--stem-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--line);">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 5l-7 7 7 7"></path></svg>
      Nergis
    </a>
    <button type="button" aria-label="Paylaş" style="width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></svg>
    </button>
  </header>

  <div style="height: 440px; background: var(--kraft);">
    <svg viewBox="0 0 390 440" width="390" height="440" aria-hidden="true" style="display: block;">
      <rect x="140" y="180" width="5" height="260" style="fill: var(--stem);"></rect>
      <rect x="192" y="128" width="5" height="312" style="fill: var(--stem);"></rect>
      <rect x="244" y="196" width="5" height="244" style="fill: var(--stem);"></rect>
      <rect x="88" y="236" width="5" height="204" style="fill: var(--stem);"></rect>
      <rect x="294" y="248" width="5" height="192" style="fill: var(--stem);"></rect>
      <rect x="121" y="112" width="44" height="76" rx="22" style="fill: var(--peony);"></rect>
      <rect x="173" y="60" width="44" height="76" rx="22" style="fill: var(--peony);"></rect>
      <rect x="225" y="132" width="44" height="76" rx="22" style="fill: var(--pollen);"></rect>
      <rect x="69" y="168" width="44" height="76" rx="22" style="fill: var(--pollen);"></rect>
      <rect x="275" y="180" width="44" height="76" rx="22" style="fill: var(--peony);"></rect>
      <path d="M0 356 C 100 316, 150 396, 390 346 L 390 440 L 0 440 Z" style="fill: var(--kraft-deep);"></path>
    </svg>
  </div>

  <section style="padding: 24px 16px 0; display: grid; gap: 8px;">
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 38px;">Bu haftanın lalesi</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Hollanda lalesi, kraft kâğıda sarılı ve rafyayla bağlı. Vazoda 5–7 gün dayanır.</p>
  </section>

  <fieldset style="margin: 28px 16px 0; padding: 0; border: 0;">
    <legend style="padding: 0; margin-bottom: 8px; font-size: 18px; line-height: 24px; font-weight: 600;">Boy</legend>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); cursor: pointer;">
      <input type="radio" name="boy" style="width: 20px; height: 20px; margin: 0; accent-color: var(--stem);">
      <span style="flex: 1; font-size: 16px; line-height: 22px;">Küçük <span style="color: var(--ink-muted);">15 dal</span></span>
      <span style="font-size: 16px; font-weight: 500;">720 TL</span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); cursor: pointer;">
      <input type="radio" name="boy" checked style="width: 20px; height: 20px; margin: 0; accent-color: var(--stem);">
      <span style="flex: 1; font-size: 16px; line-height: 22px;">Orta <span style="color: var(--ink-muted);">25 dal</span></span>
      <span style="font-size: 16px; font-weight: 500;">1.050 TL</span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer;">
      <input type="radio" name="boy" style="width: 20px; height: 20px; margin: 0; accent-color: var(--stem);">
      <span style="flex: 1; font-size: 16px; line-height: 22px;">Büyük <span style="color: var(--ink-muted);">40 dal</span></span>
      <span style="font-size: 16px; font-weight: 500;">1.480 TL</span>
    </label>
  </fieldset>

  <fieldset style="margin: 28px 16px 0; padding: 0; border: 0;">
    <legend style="padding: 0; margin-bottom: 8px; font-size: 18px; line-height: 24px; font-weight: 600;">Yanına ekleyin <span style="font-weight: 400; color: var(--ink-muted);">(isteğe bağlı)</span></legend>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); cursor: pointer;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: var(--stem);">
      <span style="flex: 1; font-size: 16px; line-height: 22px;">Cam vazo</span>
      <span style="font-size: 16px; color: var(--ink-muted);">+180 TL</span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer;">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: var(--stem);">
      <span style="flex: 1; font-size: 16px; line-height: 22px;">El yapımı çikolata, 12 adet</span>
      <span style="font-size: 16px; color: var(--ink-muted);">+240 TL</span>
    </label>
  </fieldset>

  <p style="margin: 20px 16px 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Kadıköy, Üsküdar ve Ataşehir'e teslim. 15:00'e kadar verilen siparişler aynı gün yola çıkar.</p>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 12px 16px 28px; background: var(--paper-raised); border-top: 1px solid var(--line); box-shadow: var(--shadow-lift);">
    <div style="display: grid;">
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Toplam</span>
      <span style="font-size: 20px; line-height: 24px; font-weight: 600;">1.230 TL</span>
    </div>
    <a class="tm-btn tm-btn--primary" href="Teslimat.dc.html" style="flex: 1;">Teslimat bilgilerine geç</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
