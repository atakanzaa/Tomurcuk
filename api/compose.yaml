# Yerel geliştirme veritabanı. `./mvnw spring-boot:run` bunu kendisi kaldırır.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tomurcuk
      POSTGRES_USER: tomurcuk
      POSTGRES_PASSWORD: tomurcuk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
