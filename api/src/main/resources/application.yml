spring:
  application:
    name: tomurcuk-api
  autoconfigure:
    # Giriş kendi uçlarımızla yapılır; Spring Security'nin varsayılan kullanıcısı açılmaz.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      lifecycle-management: start-only
  session:
    jdbc:
      initialize-schema: never
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      # Tamamlanan olay kayıtları silinir; tamamlanmayanlar yeniden işlenmek üzere kalır.
      completion-mode: delete

tomurcuk:
  # Alıcının ödeme sonrası döndüğü frontend adresi (callback). Ortama göre değişir.
  web-url: http://localhost:3000
  payment:
    # fake: geliştirme ve önizleme; iyzico: staging ve prod.
    provider: fake
  sms:
    # log: SMS gönderilmez, log'a yazılır (yerel, önizleme). netgsm: staging (yalnızca ekip
    # numaraları) ve prod; kullanıcı kodu, şifre ve başlık ortamın secret'larından gelir.
    provider: log
  email:
    provider: log
  jobs:
    enabled: true

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # Panel oturumu; cookie ayarları SecurityConfig'te.
      timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
