spring:
  application:
    name: tomurcuk-api
  profiles:
    group:
      # Örnek dükkânlarla çalışan ortamlar (application-demo.yml). Prod'da örnek veri yok.
      preview: demo
      staging: demo
  autoconfigure:
    # Giriş kendi uçlarımızla yapılır; Spring Security'nin varsayılan kullanıcısı açılmaz.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      lifecycle-management: start-only
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # Panel fotoğrafı tarayıcıda küçültüp gönderir; telefonun ham fotoğrafı da sığsın.
      max-file-size: 8MB
      max-request-size: 9MB
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      # Tamamlanan olay kayıtları silinir; tamamlanmayanlar yeniden işlenmek üzere kalır.
      completion-mode: delete

tomurcuk:
  # Alıcının ödeme sonrası döndüğü frontend adresi (callback). Ortama göre değişir.
  web-url: http://localhost:3000
  payment:
    # fake: geliştirme ve önizleme; iyzico: staging ve prod.
    provider: fake
    iyzico:
      # Sandbox; prod'da TOMURCUK_PAYMENT_IYZICO_BASEURL=https://api.iyzipay.com. Anahtarlar
      # ortamın secret'larından: TOMURCUK_PAYMENT_IYZICO_APIKEY, TOMURCUK_PAYMENT_IYZICO_SECRETKEY.
      base-url: https://sandbox-api.iyzipay.com
      # Alıcıdan e-posta alınmaz; iyzico zorunlu tuttuğu için Tomurcuk'un sipariş adresi yazılır.
      # iyzico biçimi doğrular: .local gibi gerçek olmayan uzantılar "email hatalı format" döner.
      buyer-email: siparis@tomurcuk.shop
      # true: pazaryeri (alt üye işyeri) hesabı; dükkânın anahtarı shop_payment_account'tan.
      marketplace: false
  sms:
    # log: SMS gönderilmez, log'a yazılır (yerel, önizleme). netgsm: staging (yalnızca ekip
    # numaraları) ve prod; kullanıcı kodu, şifre ve başlık ortamın secret'larından gelir.
    provider: log
  email:
    # log: e-posta gönderilmez, log'a yazılır. resend: sunucuda .env'e TOMURCUK_EMAIL_PROVIDER=resend
    # ve TOMURCUK_EMAIL_RESEND_APIKEY yazılınca; gönderen alan adı Resend'de doğrulanmış olmalı.
    provider: log
    from: Tomurcuk <siparis@tomurcuk.shop>
    # Yanıtların gideceği gerçek posta kutusu (TOMURCUK_EMAIL_REPLYTO), ör. destek@tomurcuk.shop.
    # Gönderen adres posta almaz; boşsa e-postalar "panelden destek talebi açın" der.
    reply-to: ""
  photos:
    # disk: yerel, testler ve R2 kurulana kadar sunucular (dizin bir volume'dür). r2: Cloudflare R2;
    # adres, bucket, önek ve herkese açık adres ortamın .env'inden, anahtarlar secret olarak
    # (TOMURCUK_PHOTOS_R2_*; deploy/README.md).
    store: disk
    disk:
      dir: data/photos
  jobs:
    enabled: true

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # Panel oturumu; cookie ayarları SecurityConfig'te.
      timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
