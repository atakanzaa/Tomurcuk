spring:
  application:
    name: tomurcuk-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      lifecycle-management: start-only
  modulith:
    events:
      republish-outstanding-events-on-restart: true

tomurcuk:
  # Alıcının ödeme sonrası döndüğü frontend adresi (callback). Ortama göre değişir.
  web-url: http://localhost:3000
  payment:
    # fake: geliştirme ve önizleme; iyzico: staging ve prod.
    provider: fake
  jobs:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
